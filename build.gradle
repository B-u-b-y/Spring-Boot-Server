plugins {
    id 'org.springframework.boot' version '3.1.0'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'     // For REST controllers and web APIs
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // For JPA repositories and database access
    runtimeOnly 'org.postgresql:postgresql'                                 // PostgreSQL driver

    // Include Jakarta Persistence API (JPA support)
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}
